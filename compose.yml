name: activity-relay

x-relay-service: &relay-service
  image: ${ACTIVITY_RELAY_IMAGE:-ghcr.io/thystra/activity-relay:2.4.0-rc6}
  working_dir: /var/lib/relay
  restart: unless-stopped
  init: true
  volumes:
    - type: bind
      source: ./actor.pem
      target: /var/lib/relay/actor.pem
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./config.yml
      target: /var/lib/relay/config.yml
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${RELAY_CACHE_DIR:-./cache}
      target: /var/cache/activity-relay
  logging: &bounded-logging
    driver: local
    options:
      max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
      max-file: ${CONTAINER_LOG_MAX_FILES:-5}
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction
      - --save
      - "900 1 300 10 60 10000"
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - ${RELAY_STORAGE_DIR:-./redisdata}:/data
    logging: *bounded-logging
    mem_limit: ${REDIS_CONTAINER_MEMORY:-768m}
    pids_limit: 128

  worker:
    <<: *relay-service
    command: ["worker"]
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    pids_limit: 256
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

  server:
    <<: *relay-service
    command: ["server"]
    ports:
      - "${RELAY_PUBLISH_ADDRESS:-127.0.0.1}:${RELAY_HTTP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://127.0.0.1:8080/status.json
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: ${SERVER_MEMORY_LIMIT:-512m}
    pids_limit: 256
