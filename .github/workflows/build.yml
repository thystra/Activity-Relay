name: Downstream Container Validation

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Multi-architecture container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate linux/amd64 and linux/arm64 container builds
        uses: docker/build-push-action@v6
        with:
          push: false
          context: .
          platforms: linux/amd64,linux/arm64
          tags: activity-relay:downstream-validation
          build-args: |
            VERSION=downstream-validation
