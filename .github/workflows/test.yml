name: Test
on: [push, pull_request]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
      - name: Test static site builder
        run: python3 -m unittest discover -s contrib/web -p 'test_*.py'
      - name: Test resource guard
        run: python3 -m unittest discover -s contrib/ops -p 'test_*.py'
      - name: Validate Caddy example
        run: |
          docker run --rm \
            --volume "$PWD/contrib/caddy/Caddyfile.example:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.2-alpine \
            caddy validate \
              --config /etc/caddy/Caddyfile \
              --adapter caddyfile
      - name: Execute test and upload coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
        run: |
          go version
          go test -coverprofile=coverage.txt -covermode=atomic -p 1 ./api ./deliver ./control ./models
          bash <(curl -s https://codecov.io/bash)
    services:
      redis:
        image: redis
        ports:
          - 6379/tcp
