name: Legacy Release Validation

# GitHub is a downstream mirror. This workflow is intentionally manual and
# validation-only; canonical release publication is owned by Forgejo.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to validate without publishing
        required: true
        type: string

permissions:
  contents: read

jobs:
  container:
    name: Validate release container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - name: Validate release tag
        id: variables
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "Release tag must begin with v and a digit: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Validate multi-architecture release build
        uses: docker/build-push-action@v6
        with:
          push: false
          context: .
          platforms: linux/amd64,linux/arm64
          tags: activity-relay:legacy-release-validation
          build-args: |
            VERSION=${{ steps.variables.outputs.version }}
          provenance: mode=max
          sbom: true

  debian-package:
    name: Validate native Debian package
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports:
          # Avoid colliding with redis-server installed by the package smoke test.
          - 6381:6379
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential debhelper devscripts golang-any lintian

      - name: Set package version from tag
        env:
          DEBEMAIL: noreply@github.com
          DEBFULLNAME: thystra
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"

          if [[ "$tag_version" == *-* ]]; then
            upstream_version="${tag_version%%-*}"
            prerelease_version="${tag_version#*-}"
            version_series="${upstream_version}~${prerelease_version}"
          else
            version_series="$tag_version"
          fi

          current_version="$(dpkg-parsechangelog --show-field Version)"

          case "$current_version" in
            "${version_series}"-[0-9]*)
              version="$current_version"
              ;;
            *)
              version="${version_series}-1"
              dch --newversion "$version" --distribution noble \
                "Release ${RELEASE_TAG}."
              ;;
          esac

          dpkg --validate-version "$version"
          echo "Debian package version: $version"

      - name: Run application tests
        env:
          REDIS_URL: redis://127.0.0.1:6381
        run: |
          go test -p 1 ./...
          go test -race -p 1 ./...
          python3 -m unittest discover -s contrib/web -p 'test_*.py'
          python3 -m unittest discover -s contrib/ops -p 'test_*.py'
          docker run --rm \
            --volume "$PWD/contrib/caddy/Caddyfile.example:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.2-alpine \
            caddy validate \
              --config /etc/caddy/Caddyfile \
              --adapter caddyfile

      - name: Build package
        run: dpkg-buildpackage --build=binary --no-sign

      - name: Inspect and lint package
        run: |
          set -euo pipefail
          package="$(find .. -maxdepth 1 -name 'activity-relay_*_amd64.deb' -print -quit)"
          changes="$(find .. -maxdepth 1 -name 'activity-relay_*_amd64.changes' -print -quit)"
          test -n "$package"
          test -n "$changes"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          lintian --fail-on error "$changes"

      - name: Test clean install and identity preservation
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euxo pipefail
          package="$(find .. -maxdepth 1 -name 'activity-relay_*_amd64.deb' -print -quit)"
          sudo apt-get install --yes --no-install-recommends "$package"
          test -x /usr/bin/relay
          test "$(/usr/bin/relay --version)" = "relay version ${RELEASE_TAG#v}"
          test -x /usr/bin/activity-relay-resource-guard
          /usr/bin/activity-relay-resource-guard --help >/dev/null
          grep --quiet '^NoNewPrivileges=false$' /usr/lib/systemd/system/activity-relay-resource-guard.service
          grep --quiet '^TimeoutStartSec=120$' /usr/lib/systemd/system/activity-relay-resource-guard.service
          grep --quiet '/var/spool/postfix/maildrop' /usr/lib/systemd/system/activity-relay-resource-guard.service
          test -f /etc/activity-relay/config.yml.example
          test -f /usr/share/doc/activity-relay/examples/caddy/Caddyfile.example
          test -f /usr/share/doc/activity-relay/examples/caddy/README.md
          test ! -e /etc/activity-relay/config.yml
          test "$(stat --format='%a' /etc/activity-relay/actor.pem)" = 600
          test "$(stat --format='%U:%G' /etc/activity-relay/actor.pem)" = activity-relay:activity-relay
          actor_hash="$(sudo sha256sum /etc/activity-relay/actor.pem)"
          if key_output="$(sudo /usr/bin/relay generate-key --output /etc/activity-relay/actor.pem 2>&1)"; then
            echo "generate-key unexpectedly replaced an existing actor identity" >&2
            exit 1
          fi
          grep --quiet 'actor key already exists' <<<"$key_output"
          test "$(sudo sha256sum /etc/activity-relay/actor.pem)" = "$actor_hash"
          sudo dpkg --install "$package"
          test "$(sudo sha256sum /etc/activity-relay/actor.pem)" = "$actor_hash"
          test ! -e /etc/systemd/system/multi-user.target.wants/activity-relay-server.service
          test ! -e /etc/systemd/system/multi-user.target.wants/activity-relay-worker.service
          test ! -e /etc/systemd/system/timers.target.wants/activity-relay-resource-guard.timer

      - name: Prepare validation assets
        run: |
          set -euo pipefail
          mkdir -p dist
          package="$(find .. -maxdepth 1 -name 'activity-relay_*_amd64.deb' -print -quit)"
          test -n "$package"
          package_name="$(basename "$package")"
          validation_name="$(printf '%s' "$package_name" | tr '~' '-')"
          cp "$package" "dist/$validation_name"
          cd dist
          sha256sum ./*.deb > SHA256SUMS

      - uses: actions/upload-artifact@v5
        with:
          name: activity-relay-debian-amd64-validation
          path: dist/
          if-no-files-found: error
