name: Release Build
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to package and publish
        required: true
        type: string

jobs:
  build:
    name: Release Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_PASS: ${{ secrets.REGISTRY_PASS }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - id: variables
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          ref="$RELEASE_TAG"
          case "$ref" in
            v[0-9]*) ;;
            *) echo "Release tag must begin with v and a digit: $ref" >&2; exit 1 ;;
          esac
          version="${ref#v}"
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Generate GHCR metadata
        id: ghcr-metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/activity-relay
          tags: |
            type=semver,pattern={{version}},value=${{ steps.variables.outputs.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.variables.outputs.ref }},enable=${{ steps.variables.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=${{ steps.variables.outputs.ref }},enable=${{ steps.variables.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.variables.outputs.prerelease == 'false' }}
      - name: Generate Docker Hub metadata
        if: env.REGISTRY_USER != '' && env.REGISTRY_PASS != ''
        id: dockerhub-metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_USER }}/activity-relay
          tags: |
            type=semver,pattern={{version}},value=${{ steps.variables.outputs.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.variables.outputs.ref }},enable=${{ steps.variables.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=${{ steps.variables.outputs.ref }},enable=${{ steps.variables.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.variables.outputs.prerelease == 'false' }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: env.REGISTRY_USER != '' && env.REGISTRY_PASS != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASS }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish container to GHCR
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.ghcr-metadata.outputs.tags }}
          labels: ${{ steps.ghcr-metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.variables.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Publish container to Docker Hub
        if: env.REGISTRY_USER != '' && env.REGISTRY_PASS != ''
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.dockerhub-metadata.outputs.tags }}
          labels: ${{ steps.dockerhub-metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.variables.outputs.version }}
          provenance: mode=max
          sbom: true

  debian-package:
    name: Build native Debian package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    services:
      redis:
        image: redis:7-alpine
        ports:
          # Avoid colliding with redis-server installed by the package smoke test.
          - 6381:6379
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential debhelper devscripts golang-any lintian

      - name: Set package version from tag
        env:
          DEBEMAIL: noreply@github.com
          DEBFULLNAME: thystra
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"

          if [[ "$tag_version" == *-* ]]; then
            upstream_version="${tag_version%%-*}"
            prerelease_version="${tag_version#*-}"
            version_series="${upstream_version}~${prerelease_version}"
          else
            version_series="$tag_version"
          fi

          current_version="$(dpkg-parsechangelog --show-field Version)"

          case "$current_version" in
            "${version_series}"-[0-9]*)
              version="$current_version"
              ;;
            *)
              version="${version_series}-1"
              dch --newversion "$version" --distribution noble \
                "Release ${RELEASE_TAG}."
              ;;
          esac

          dpkg --validate-version "$version"
          echo "Debian package version: $version"

      - name: Run application tests
        env:
          REDIS_URL: redis://127.0.0.1:6381
        run: |
          go test -p 1 ./...
          python3 -m unittest discover -s contrib/web -p 'test_*.py'
          python3 -m unittest discover -s contrib/ops -p 'test_*.py'

      - name: Build package
        run: dpkg-buildpackage --build=binary --no-sign

      - name: Inspect and lint package
        run: |
          package="$(find .. -maxdepth 1 -name 'activity-relay_*_amd64.deb' -print -quit)"
          changes="$(find .. -maxdepth 1 -name 'activity-relay_*_amd64.changes' -print -quit)"
          test -n "$package"
          test -n "$changes"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          lintian --fail-on error "$changes"

      - name: Test clean install and identity preservation
        run: |
          set -euxo pipefail
          package="$(find .. -maxdepth 1 -name 'activity-relay_*_amd64.deb' -print -quit)"
          sudo apt-get install --yes --no-install-recommends "$package"
          test -x /usr/bin/relay
          test -x /usr/bin/activity-relay-resource-guard
          /usr/bin/activity-relay-resource-guard --help >/dev/null
          grep --quiet '^NoNewPrivileges=false$' /usr/lib/systemd/system/activity-relay-resource-guard.service
          grep --quiet '^TimeoutStartSec=120$' /usr/lib/systemd/system/activity-relay-resource-guard.service
          grep --quiet '/var/spool/postfix/maildrop' /usr/lib/systemd/system/activity-relay-resource-guard.service
          test -f /etc/activity-relay/config.yml.example
          test ! -e /etc/activity-relay/config.yml
          test "$(stat --format='%a' /etc/activity-relay/actor.pem)" = 600
          test "$(stat --format='%U:%G' /etc/activity-relay/actor.pem)" = activity-relay:activity-relay
          actor_hash="$(sudo sha256sum /etc/activity-relay/actor.pem)"
          if key_output="$(sudo /usr/bin/relay generate-key --output /etc/activity-relay/actor.pem 2>&1)"; then
            echo "generate-key unexpectedly replaced an existing actor identity" >&2
            exit 1
          fi
          grep --quiet 'actor key already exists' <<<"$key_output"
          test "$(sudo sha256sum /etc/activity-relay/actor.pem)" = "$actor_hash"
          sudo dpkg --install "$package"
          test "$(sudo sha256sum /etc/activity-relay/actor.pem)" = "$actor_hash"
          test ! -e /etc/systemd/system/multi-user.target.wants/activity-relay-server.service
          test ! -e /etc/systemd/system/multi-user.target.wants/activity-relay-worker.service
          test ! -e /etc/systemd/system/timers.target.wants/activity-relay-resource-guard.timer

      - name: Prepare release assets
        run: |
          mkdir -p dist
          package="$(find .. -maxdepth 1 -name 'activity-relay_*_amd64.deb' -print -quit)"
          test -n "$package"
          package_name="$(basename "$package")"
          release_name="$(printf '%s' "$package_name" | tr '~' '-')"
          if [[ "$release_name" == *'~'* ]]; then
            echo "Release filename still contains a tilde: $release_name" >&2
            exit 1
          fi
          cp "$package" "dist/$release_name"
          cd dist
          sha256sum ./*.deb > SHA256SUMS

      - uses: actions/upload-artifact@v5
        with:
          name: activity-relay-debian-amd64
          path: dist/
          if-no-files-found: error

      - name: Attach package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            release_args=(--title "$RELEASE_TAG" --generate-notes)
            if [[ "${RELEASE_TAG#v}" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/* "${release_args[@]}"
          fi
