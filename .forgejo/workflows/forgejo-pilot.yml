name: Forgejo pilot smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    name: Repository-scoped runner smoke test
    runs-on: forgejo-workstation
    timeout-minutes: 10

    steps:
      - name: Verify Forgejo runner context
        shell: bash
        run: |
          set -euo pipefail

          test "${CI:-}" = "true"
          test "${FORGEJO_ACTIONS:-}" = "true"
          test "${FORGEJO_SERVER_URL:-}" = "https://forgejo.argentwolf.org"
          test "${FORGEJO_REPOSITORY:-}" = "alan/activity-relay"

          echo "CI=$CI"
          echo "FORGEJO_ACTIONS=$FORGEJO_ACTIONS"
          echo "FORGEJO_SERVER_URL=$FORGEJO_SERVER_URL"
          echo "FORGEJO_REPOSITORY=$FORGEJO_REPOSITORY"
          echo "FORGEJO_RUN_ID=$FORGEJO_RUN_ID"

          uname -a
          id
          node --version
          git --version

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify checkout and container isolation
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$FORGEJO_SHA"
          test -z "$(git status --porcelain)"

          # The repository-scoped pilot runner deliberately does not expose the
          # host Docker socket. Container builds use the separate forgejo-build
          # runner once the pilot boundary has been revalidated for this repo.
          test ! -S /var/run/docker.sock

          echo "checkout_sha=$actual_sha"
          echo "docker_socket_exposed=NO"
          git log -1 --oneline --decorate
