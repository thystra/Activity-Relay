name: Forgejo pilot smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    name: Repository-scoped runner smoke test
    runs-on: forgejo-workstation
    timeout-minutes: 10

    steps:
      - name: Verify Forgejo runner context
        shell: bash
        run: |
          set -euo pipefail

          # Print only non-secret execution context before asserting it so a
          # failed smoke test is diagnostic rather than opaque.
          printf 'CI=%s\n' "${CI:-<unset>}"
          printf 'FORGEJO_ACTIONS=%s\n' "${FORGEJO_ACTIONS:-<unset>}"
          printf 'FORGEJO_SERVER_URL=%s\n' "${FORGEJO_SERVER_URL:-<unset>}"
          printf 'FORGEJO_REPOSITORY=%s\n' "${FORGEJO_REPOSITORY:-<unset>}"
          printf 'FORGEJO_RUN_ID=%s\n' "${FORGEJO_RUN_ID:-<unset>}"
          printf 'GITHUB_ACTIONS=%s\n' "${GITHUB_ACTIONS:-<unset>}"
          printf 'GITHUB_SERVER_URL=%s\n' "${GITHUB_SERVER_URL:-<unset>}"
          printf 'GITHUB_REPOSITORY=%s\n' "${GITHUB_REPOSITORY:-<unset>}"
          printf 'RUNNER_OS=%s\n' "${RUNNER_OS:-<unset>}"
          printf 'RUNNER_ARCH=%s\n' "${RUNNER_ARCH:-<unset>}"

          actions="${FORGEJO_ACTIONS:-${GITHUB_ACTIONS:-}}"
          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:-}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          run_id="${FORGEJO_RUN_ID:-${GITHUB_RUN_ID:-}}"

          test "${CI:-}" = "true"
          test "$actions" = "true"
          test "${server_url%/}" = "https://forgejo.argentwolf.org"
          test "${repository,,}" = "alan/activity-relay"
          test -n "$run_id"

          uname -a
          id
          node --version
          git --version

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify checkout and container isolation
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          expected_sha="${FORGEJO_SHA:-${GITHUB_SHA:-}}"
          test -n "$expected_sha"
          test "$actual_sha" = "$expected_sha"
          test -z "$(git status --porcelain)"

          # The workstation runner may use its dedicated DinD service, but the
          # job must never receive the host Docker daemon's Unix socket.
          test ! -S /var/run/docker.sock

          echo "checkout_sha=$actual_sha"
          echo "docker_socket_exposed=NO"
          git log -1 --oneline --decorate
